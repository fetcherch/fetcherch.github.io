<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<style>
:root{--bg:#f7f8f5;--ink:#20231f;--muted:#747a70;--accent:#55705b;--line:#e3e7df}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(520px,100%);text-align:center}
.code{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(90px,22vw,160px);font-weight:500;line-height:.85;letter-spacing:-.07em;color:var(--accent)}
.divider{width:48px;height:1px;margin:25px auto 0;background:var(--line)}
h1{margin:28px 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,6vw,40px);font-weight:500;letter-spacing:-.03em}
p{max-width:420px;margin:0 auto;color:var(--muted);font-size:15px;line-height:1.6}
a{display:inline-block;margin-top:26px;padding:12px 18px;border-radius:11px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none;transition:.18s ease}
a:hover{transform:translateY(-1px);filter:brightness(.96)}
</style>
</head>
<body>
<main>
<div class="code">404</div>
<div class="divider"></div>
<h1>Page not found.</h1>
<p>The page you're looking for doesn't exist, was moved, or may have wandered off somewhere.</p>
<a href="/">Back to Your Dictionary</a>
</main>
</body>
</html>
