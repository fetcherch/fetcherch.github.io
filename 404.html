<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 · Page not found | AdCars.ch</title>

  <style>
    :root{
      --ink:#111318;
      --muted:#667085;
      --line:#e7e9ee;
      --bg:#f7f8fa;
      --accent:#fe5a36;
    }

    *{box-sizing:border-box}

    html,body{margin:0;min-height:100%}

    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:var(--bg);
      line-height:1.5;
    }

    a{text-decoration:none;color:inherit}

    .container{
      width:min(1120px,calc(100% - 48px));
      margin-inline:auto;
    }

    /* Same header styling as index.html, with only the logo visible. */
    nav{
      height:76px;
      background:rgba(255,255,255,.9);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      position:sticky;
      top:0;
      z-index:20;
    }

    .navin{
      display:flex;
      align-items:center;
      height:76px;
    }

    .logo{
      font-size:22px;
      font-weight:900;
      letter-spacing:-1px;
      color:var(--accent);
    }

    .logo .car,
    .logo .rest{
      color:var(--accent);
    }

    main{
      flex:1;
      display:grid;
      place-items:center;
      width:100%;
      padding:64px 24px;
    }

    .error-card{
      width:min(620px,100%);
      text-align:center;
    }

    .error-code{
      margin:0;
      color:var(--accent);
      font-size:clamp(92px,20vw,160px);
      font-weight:950;
      line-height:.85;
      letter-spacing:-.07em;
    }

    h1{
      margin:30px 0 12px;
      font-size:clamp(30px,6vw,46px);
      line-height:1.08;
      letter-spacing:-.04em;
    }

    .error-card p{
      max-width:500px;
      margin:0 auto;
      color:var(--muted);
      font-size:17px;
      line-height:1.6;
    }

    .actions{
      display:flex;
      justify-content:center;
      margin-top:30px;
    }

    .btn{
      background:var(--accent);
      color:white;
      padding:12px 18px;
      border-radius:12px;
      font-weight:800;
      font-size:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:0;
      cursor:pointer;
    }

    .btn:hover{opacity:.92}

    .btn:focus-visible,
    .logo:focus-visible{
      outline:3px solid rgba(254,90,54,.25);
      outline-offset:3px;
    }

    footer{
      padding:24px 20px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }

    @media(max-width:700px){
      .container{
        width:min(100% - 32px,1120px);
      }

      nav,
      .navin{
        height:70px;
      }

      main{
        padding:48px 20px;
      }

      .error-card p{
        font-size:16px;
      }

      .btn{
        width:100%;
        max-width:340px;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="container navin">
      <a class="logo" href="/" aria-label="AdCars.ch home">
        <span class="car">Ad</span><span class="rest">Cars.ch</span>
      </a>
    </div>
  </nav>

  <main>
    <section class="error-card" aria-labelledby="errorTitle">
      <div class="error-code" aria-hidden="true">404</div>
      <h1 id="errorTitle">Page not found</h1>
      <p>
        The page you're looking for doesn't exist or may have been moved.
        Head back to AdCars.ch and continue from there.
      </p>

      <div class="actions">
        <a class="btn" href="/">Back to homepage</a>
      </div>
    </section>
  </main>

  <footer>
    © <span id="year"></span> AdCars.ch
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
